<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f7fa"><title>견적서 작성기</title><meta name="description" content="말하거나 입력하면 검토 가능한 HWPX 견적서를 만듭니다."><link rel="preconnect" href="https://cdn.jsdelivr.net"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css"><link rel="stylesheet" href="/style.css?v=3"><style>[hidden]{display:none!important}</style></head>
<body><header class="topbar"><a class="brand" href="/" aria-label="견적서 작성기 홈"><span class="brand-mark" aria-hidden="true">Q</span><span>견적서 작성기</span></a><nav class="page-nav" aria-label="페이지 메뉴"><a href="/">홈</a><a href="/create" aria-current="page">견적서 만들기</a></nav><span class="privacy">AI 분석을 위해 입력 내용이 전송됩니다</span></header>
<main><section class="workspace" aria-label="견적서 작성"><aside class="input-panel"><div class="panel-heading"><div><p class="step">새 견적</p><h1>요청 내용을<br>입력하세요.</h1><p id="speechSupport">필요한 내용을 적거나, 마이크로 말해 보세요.</p></div><button id="micButton" class="mic-button" type="button" aria-pressed="false"><span class="mic-icon" aria-hidden="true">●</span><span id="micLabel">음성 입력</span></button></div><label class="sr-only" for="requestInput">견적 요청 내용</label><textarea id="requestInput" rows="11" placeholder="예) 한빛상사에 보낼 사무용 의자 10개 견적서를 만들어줘. 개당 12만원, 배송비는 5만원이고 부가세는 별도야."></textarea><div class="live-row" id="liveRow" role="status" aria-live="polite" aria-atomic="true" hidden><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>듣고 있습니다. 말한 내용이 실시간으로 입력됩니다.</span></div><button id="parseButton" class="primary-button" type="button">AI로 견적 초안 만들기</button><p id="inputError" class="message error" role="alert"></p></aside>
<section class="quote-panel" id="quotePanel" aria-label="견적서 미리보기"><div class="empty-state" id="emptyState" aria-hidden="true"></div><form id="quoteForm" class="quote-sheet" hidden><header class="quote-head"><div><p class="step">quotation</p><h2>견적서</h2></div><label>견적서 번호<input id="quoteNumber" required></label></header>
<section class="document-section parties"><div class="party-column"><div class="section-heading"><h3>공급자</h3></div><div class="document-fields"><label>상호<input id="supplierCompany" autocomplete="organization"></label><label>대표자<input id="supplierRepresentative" autocomplete="name"></label><label>사업자등록번호<input id="supplierRegistration" inputmode="numeric"></label><label>주소<input id="supplierAddress" autocomplete="street-address"></label></div></div><div class="party-column"><div class="section-heading"><h3>고객</h3></div><div class="document-fields"><label>회사명 또는 성명<input id="clientName" required></label><label>담당자 · 연락처<input id="clientContact"></label><label>견적일<input id="quoteDate" type="date" required></label><label>견적 유효기간<input id="validUntil" type="date"></label></div></div></section>
<section class="document-section items-section"><div class="section-heading"><h3>품목 내역</h3><span>수량과 단가를 수정하면 합계가 즉시 계산됩니다</span></div><div class="table-wrap"><table><thead><tr><th>번호</th><th>품목명</th><th>규격</th><th>수량</th><th>단위</th><th>단가</th><th>공급가액</th><th>부가세</th><th>합계</th><th></th></tr></thead><tbody id="itemRows"></tbody></table></div><button id="addItem" class="text-button" type="button">+ 품목 추가</button></section>
<div class="quote-bottom"><label class="notes">비고<textarea id="notes" rows="3" placeholder="납기, 결제 조건 등 필요한 내용을 적어 주세요."></textarea></label><div class="totals"><label>부가세율 <span><input id="taxRate" type="number" min="0" max="100" step="0.1">%</span></label><p><span>공급가액</span><strong id="supplyTotal">0원</strong></p><p><span>부가세</span><strong id="taxTotal">0원</strong></p><p class="grand-total"><span>견적 합계</span><strong id="grandTotal">0원</strong></p></div></div><p id="exportError" class="message error" role="alert"></p><div class="download-actions"><button class="download-button" type="submit" data-format="hwpx">HWPX 다운로드</button><button class="download-button secondary-download" type="button" id="pdfButton">PDF 다운로드</button></div></form></section></section></main>
<template id="itemTemplate"><tr><td class="item-number"></td><td><input data-field="name" aria-label="품목명" required></td><td><input data-field="spec" aria-label="규격"></td><td><input data-field="quantity" aria-label="수량" type="number" min="0.01" step="any" required></td><td><input data-field="unit" aria-label="단위" value="개"></td><td><input data-field="unitPrice" aria-label="단가" type="number" min="0" step="1" required></td><td class="line-supply">0원</td><td class="line-tax">0원</td><td class="line-total">0원</td><td><button class="remove-item" type="button" aria-label="품목 삭제">×</button></td></tr></template><script type="module" src="/app.js?v=4"></script></body></html>
